<footer class="footer">
  <p class="footer__title">¡Seguinos!</p>
  <p class="footer__text">Enterate de nuestras novedades y promociones.</p>
  <a class="footer__button" [href]="instagramUrl()" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2" />
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
      <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" />
    </svg>
    &#64;{{ instagram() }}
  </a>
  <p class="footer__updated">Precios actualizados al {{ updatedLabel() }}</p>
</footer>
